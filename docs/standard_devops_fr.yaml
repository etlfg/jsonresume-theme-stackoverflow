work:
  - name: Akeneo
    website: https://www.akeneo.com
    position: Administrateur Système DevOps
    location: Lille, France
    startDate: "2022-06"
    endDate: "2022-11"
    summary: |
      Maintenance en conditions opérationnelles des outils du support IT, déploiement des applications sur des environnements managés,
      aide à la montée en compétence de l'équipe sur les nouvelles technologies
    highlights:
      - Migré 4 applications d'un IaaS legacy vers des services managés sur le Cloud réduisant les coûts infra de 30% et l'overhead ops de 40%
      - Assuré le support quotidien pour 300+ employés maintenant un temps de réponse de moins de 2 jours en équipe de 2,5 ETH
      - Implémenté et appliqué des pratiques de sécurité réduits d'un facteur 10 sur une fenêtre glissante de 1 semaine
    technologies:
      - Linux, Docker, Ansible, GCP, Google Workspace, Datadog, Gitlab/Gitlab-CI, Bash, Python, MariaDB, Apache httpd

  - name: RCA
    website: https://rca.fr
    position: Site Reliability Engineer
    location:
      city: Paris
      countryCode: FR
    startDate: "2021-12"
    endDate: "2022-05"
    summary: |
      Maintenance en conditions opérationnelles, garant de la plate-forme d'intégration continue, des environnements de développement
      à la demande et de l'infrastructure globale, du réseau informatique et de la sécurité
    highlights:
      - Maintenu une plate-forme d'hébergement et de cluster Kubernetes à la demande à 99.9% uptime 20+ environnements pour 50+ développeurs et réduit le provisionnement de 10min+ à -2min
      - Réduit le temps de réponse des incidents de 60% dans une équipe de 5,5 ETH
      - Travaillé avec 5 équipes dev pour architecturer une suite de templates de pipelines CI/CD et migrer 8 services vers une architecture event-driven
    technologies:
      - Linux, Kubernetes, Docker, Rancher, Ansible, Gitlab/Gitlab-CI, Bash, Go, PostgreSQL, Kafka, ZFS, Proxmox, OPNSense, Elastic, HAProxy, Apache httpd

  - name: Pôle-Emploi
    website: https://pole-emploi.fr
    position: Intégrateur DevOps
    location: Paris, France
    startDate: "2019-12"
    endDate: "2021-12"
    summary: Intégration DevOps polyvalente dans l'équipe transversale de déploiement et de support des outils de développement et de test
    highlights:
      - Migré 6+ apps vers le cloud privé, passant de 50 serveurs sur 6 mainframes à 500+ pods sur 10 clusters avec déploiements zero-downtime
      - Étendu pipelines pour passer de 4 déploiements par an à 30+ microservices déployés toutes les semaines avec scans de sécurité auto bloquant 200+ vulnérabilités / semaine avant le passage en prod
      - Automatisé 10+ tâches d'admin éliminant 15h+/semaine en travail manuel
    technologies:
      - Linux, Git, Kubernetes (PKS), Docker, Vagrant, Bash, Python, Ansible, Gitlab/Gitlab-CI, Jenkins, Bash, Python, PostgreSQL, XL Deploy/Release, nginx, Java, maven, gradle, Sonar

  - name: Skale-5
    website: https://www.skale-5.com
    position: Ingénieur Cloud DevOps
    location:
      city: Nantes
      region: Pays de la Loire
      countryCode: FR
    startDate: "2018-05"
    endDate: "2019-08"
    summary: |
      Migration des projets web e-commerce du groupe Mousquetaires vers le cloud (Google Cloud Plateform),
      évolution et maintenance en conditions opérationnelles
    highlights:
      - Construit stack observabilité complète supervisant 30+ microservices permettant un SLA de 99.95%
      - Automatisé le déploiement d'ingresses vers une plateforme permettant des releases zero-downtime pour 4 applications majeures visant des temps de réponse <2sec à 1000+ utilisateurs/min
      - Maintenu une plateforme cloud-native avec réponse sur incident <2j en équipe de 8-10 ETH plate-forme pour 50 développeurs dans un environnement à 5 déploiements en production / semaine
    technologies:
      - Linux, Git, GCP, Kubernetes, Docker, Ansible, Terraform, Prometheus, Grafana, Nexus, Vagrant, Rancher, Ansible, Gitlab/Gitlab-CI, Bash, PostgreSQL, Kafka, Elastic, HAProxy, nginx, Sonar

  - name: Groupe Sewan
    website: https://www.sewan.fr
    position: Ingénieur DevOps
    location: Paris, France
    startDate: "2017-09"
    endDate: "2018-04"
    summary: Développement d'un service web de type IaaS multi-utilisateurs pour la création de machines virtuelles sur une unique infrastructure VMware.
    highlights:
      - Architecturé plateforme IaaS multi-tenant permettant le provisioning de VMs en self-service pour 500+ machines
      - Standardisé les environnements dev, réduisant l'onboarding de 1 semaine à 30min et imposant un tooling cohérent sur 4 environnements de développement et 2 nouvelles applications bootstrappés en une journée
      - Automatisé des pipelines de test d'intégration et le déploiement des applications passant les cycles de releases hebdo à quotidien et passant de 0 à 95% en couverture tests
    technologies:
      - Linux, Git, VueJS/Javascript, Bash, Python, MySQL, Ansible, Gitlab/Gitlab-CI, Elastic, nginx

  - name: Rcup
