      - Conçu architecture acquisition données et restitution des données ingérant et présentant jusqu'à 50K+ événements/jour depuis 200+ capteurs bâtiment
      - Maintenu une base documentaire qualité ISO9001:2018 de 15 documents mis à jour automatiquement dans l'ordre de la minute
    technologies:
      - Linux, Git, AngularJS, node.js/Javascript, MongoDB, Gitlab, Bash, MySQL, AWS

  - name: Signeer Ltd.
