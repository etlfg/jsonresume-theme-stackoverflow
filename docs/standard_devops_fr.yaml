meta:
  language: fr
  theme:
    # Theme customization properties for Stack Overflow theme
    # Uncomment and modify any of these to override the default light mode colors
    # Color variables available in the theme:

    # Primary accent color - Used for section title backgrounds, reference borders, and other accents
    # Default light mode: #ff6d1f (orange)
    primaryColor: '#ff6d1f'

    # Main text color - Used for body text content
    # Default light mode: #40484f (dark gray-blue)
    textColor: '#40484f'

    # Secondary text color - Used for company names, dates, locations, and other secondary information
    # Default light mode: #606d76 (medium gray-blue)
    textSecondaryColor: '#606d76'

    # Heading color - Used for your name, label, and all section titles (Compétences, Expérience professionnelle, etc.)
    # Default light mode: #202931 (very dark gray-blue)
    headingColor: '#202931'

    # Link color - Used for clickable links (social profiles, websites, etc.)
    # Default light mode: #0095ff (bright blue)
    linkColor: '#0095ff'

    # Page background color - Main background of the entire resume
    # Default light mode: #fff (white) - Note: this uses --color-section-title-bg as fallback
    backgroundColor: '#fff'

    # Alternate background color - Used for summary sections (main summary and work experience summaries)
    # Default light mode: #f1f8ff (very light blue)
    backgroundAltColor: '#f1f8ff'

    # Header background color - Background color for the header section (name, title, contact info)
    # Default: transparent (uses page background)
    headerBgColor: '#68b6e3'

    # Border color - Used for borders between sections and around elements
    # Default light mode: #ccc (light gray)
    borderColor: '#ccc'

    # Keyword/skill tag background color - Background color of skill and keyword tags
    # Default light mode: #dfeaf1 (light blue-gray)
    keywordBgColor: '#dfeaf1'

    # Keyword/skill tag text color - Color of text inside skill and keyword tags
    # Default light mode: #2c5777 (dark blue-gray)
    keywordTextColor: '#2c5777'

    # Base font family - Font stack used throughout the resume
    # Default: "Helvetica Neue", Helvetica, Arial, "Lucida Grande", sans-serif
    fontFamily: '"Helvetica Neue", Helvetica, Arial, "Lucida Grande", sans-serif'
