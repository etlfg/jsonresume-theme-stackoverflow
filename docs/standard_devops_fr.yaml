    position: Architecte technique
    startDate: "2017-02"
    endDate: "2017-08"
    summary: |
      Développement d'une application de gestion de semelles connectées pour l'acquisition, le traitement, et la présentation
      des données collectées dans un environnement agile.
    highlights:
      - Défini les exigences et rédigé les specs fonctionnelles et techniques pour une plateforme IoT traitant 10K+ événements/jour pour des semelles connectées
      - Conçu architecture cloud-native et implémenté pipeline CI/CD pour déploiements auto passant de l'ordre de +1h à <1min
      - Administré une infra Linux de 2 serveurs, écrit des scripts d'automatisation réduisant le temps de travail de l'heure à la minute, et configuré le monitoring/alerting services production réduisant les incidents de 100%
